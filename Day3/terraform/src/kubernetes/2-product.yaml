apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deploy
  namespace: apdev
  labels:
    app: product
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      serviceAccountName: product
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["stress"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: product
          image: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/apdev-product:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "150Mi"
            limits:
              cpu: "300m"
              memory: "300Mi"
          env:
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: apdev-db-config
                  key: MYSQL_USER
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: apdev-db-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: apdev-db-config
                  key: MYSQL_PORT
            - name: MYSQL_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: apdev-db-config
                  key: MYSQL_DBNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apdev-db-secret
                  key: MYSQL_PASSWORD
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: apdev-db-config
                  key: S3_BUCKET
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 20"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: product-svc
  namespace: apdev
spec:
  type: ClusterIP
  selector:
    app: product
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-hpa
  namespace: apdev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-deploy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 120