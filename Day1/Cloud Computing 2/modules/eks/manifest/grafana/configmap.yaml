apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-wskorea26-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  wskorea26-dashboard.json: |
    {
      "uid": "wskorea26-monitoring",
      "title": "wskorea26-monitoring",
      "schemaVersion": 39,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "book app Pod CPU Usage (cores)",
          "description": "wskorea26 네임스페이스 book 애플리케이션 파드별 CPU 사용량",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 4,
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"wskorea26\", pod=~\"book-.*\", container!=\"\", container!=\"POD\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
