adminUser: admin
adminPassword: "Skills53#"
nodeSelector:
  role: addon
persistence:
  enabled: false
initChownData:
  enabled: false
serviceAccount:
  create: false
  name: grafana
grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s/grafana"
    serve_from_sub_path: true
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc
        isDefault: true
      - name: CloudWatch
        uid: cloudwatch
        type: cloudwatch
        access: proxy
        jsonData:
          authType: default
          defaultRegion: ap-northeast-2
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: wsi
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/wsi
dashboardsConfigMaps:
  wsi: grafana-wsi-dashboard
