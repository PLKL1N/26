serviceAccount:
  create: false
  name: aws-for-fluent-bit

tolerations:
  - operator: Exists

input:
  enabled: true
  tag: book.*
  path: /var/log/containers/book-*_skills_*.log
  db: /var/log/flb_book.db
  multilineParser: cri
  memBufLimit: 50MB
  skipLongLines: "On"
  refreshInterval: 10

filter:
  enabled: false

additionalFilters: |
  [FILTER]
      Name    lua
      Match   book.*
      script  /fluent-bit/scripts/setaz.lua
      call    set_az

cloudWatch:
  enabled: false

cloudWatchLogs:
  enabled: true
  match: "book.*"
  region: ap-northeast-2
  logGroupName: /eks/book-svc/access
  logStreamPrefix: "from-fluentbit"   # 1.9.10 은 prefix 가 비면 init 실패. 더미값(공백X) 필요. 실제 스트림명은 logStreamTemplate 가 결정.
  logStreamTemplate: "$az_stream"
  autoCreateGroup: "true"

volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: setaz-script
    configMap:
      name: fluentbit-setaz

volumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: setaz-script
    mountPath: /fluent-bit/scripts
