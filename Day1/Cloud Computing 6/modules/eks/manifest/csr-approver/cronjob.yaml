apiVersion: v1
kind: ServiceAccount
metadata:
  name: csr-approver
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csr-approver
rules:
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["update"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["kubernetes.io/kubelet-serving"]
    verbs: ["approve"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csr-approver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csr-approver
subjects:
  - kind: ServiceAccount
    name: csr-approver
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: csr-approver
  namespace: kube-system
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        spec:
          serviceAccountName: csr-approver
          restartPolicy: OnFailure
          tolerations:
            - operator: Exists
          containers:
            - name: approver
              image: KUBECTL_IMAGE
              command:
                - /bin/sh
                - -c
                - |
                  for i in $(seq 1 10); do
                    kubectl get csr -o go-template='{{range .items}}{{if not .status.conditions}}{{if eq .spec.signerName "kubernetes.io/kubelet-serving"}}{{.metadata.name}}{{"\n"}}{{end}}{{end}}{{end}}' \
                      | xargs -r -n1 kubectl certificate approve || true
                    sleep 10
                  done
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
