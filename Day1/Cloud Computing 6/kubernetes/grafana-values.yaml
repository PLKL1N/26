# 5. Dashboard - Grafana (monitoring NS, ALB)
# helm install o11y-grafana grafana/grafana -n monitoring -f grafana-values.yaml
fullnameOverride: o11y-grafana

# Admin 계정: skills<선수등록번호> / GoodJob!Skills<선수등록번호>^^
# 아래 __NN__ 을 본인 선수등록번호로 치환하세요 (deploy.sh 가 COMPETITOR 로 치환).
adminUser: skills__NN__
adminPassword: GoodJob!Skills__NN__^^

service:
  type: ClusterIP

# ALB: o11y-grafana-alb / TargetGroup: o11y-grafana-tg
ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: o11y-grafana-alb
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  path: /
  pathType: Prefix

# Loki Datasource
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://o11y-loki.monitoring.svc.cluster.local:3100
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    log-overview:
      json: |
        {
          "title": "Log Overview",
          "uid": "log-overview",
          "schemaVersion": 39,
          "timezone": "browser",
          "time": { "from": "now-1h", "to": "now" },
          "refresh": "30s",
          "panels": [
            {
              "type": "barchart",
              "title": "Log Count Over Time",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "loki", "uid": "loki" },
              "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
              "targets": [
                {
                  "expr": "sum by (level) (count_over_time({k8s_namespace_name=\"o11y\"} | json | label_format level=`{{ lower .level }}` [$__interval]))",
                  "legendFormat": "{{level}}"
                }
              ]
            },
            {
              "type": "piechart",
              "title": "Log Level Distribution",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "loki", "uid": "loki" },
              "options": { "legend": { "displayMode": "list", "placement": "right" } },
              "targets": [
                {
                  "expr": "sum by (level) (count_over_time({k8s_namespace_name=\"o11y\"} | json | label_format level=`{{ lower .level }}` [$__range]))",
                  "legendFormat": "{{level}}"
                }
              ]
            },
            {
              "type": "logs",
              "title": "Recent Logs",
              "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 },
              "datasource": { "type": "loki", "uid": "loki" },
              "options": { "showTime": true, "sortOrder": "Descending" },
              "targets": [
                { "expr": "{k8s_namespace_name=\"o11y\"}" }
              ]
            }
          ]
        }
