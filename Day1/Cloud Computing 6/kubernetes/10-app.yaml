# 2. Log Producer Application  (Namespace: o11y)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: o11y
  labels: { app: log-generator }
spec:
  replicas: 2
  selector:
    matchLabels: { app: log-generator }
  template:
    metadata:
      labels: { app: log-generator }
    spec:
      containers:
        - name: app
          # deploy.sh 가 ECR_URL 로 치환합니다.
          image: __ECR_URL__:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: log-generator
  namespace: o11y
spec:
  type: ClusterIP
  selector: { app: log-generator }
  ports:
    - port: 8080
      targetPort: 8080
---
# ALB: o11y-app-alb / TargetGroup: o11y-app-tg
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-generator
  namespace: o11y
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: o11y-app-alb
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-generator
                port:
                  number: 8080
