fullnameOverride: o11y-grafana

adminUser: skills__NN__
adminPassword: GoodJob!Skills__NN__^^

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://o11y-loki.monitoring.svc.cluster.local:3100
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    log-overview:
      json: |
        {
          "title": "Log Overview",
          "uid": "log-overview",
          "schemaVersion": 39,
          "timezone": "browser",
          "time": {
            "from": "now-1h",
            "to": "now"
          },
          "refresh": "30s",
          "panels": [
            {
              "type": "timeseries",
              "title": "Log Count Over Time",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "bars",
                    "fillOpacity": 100,
                    "lineWidth": 1,
                    "barAlignment": 0,
                    "pointSize": 1,
                    "showPoints": "never",
                    "stacking": {
                      "mode": "normal",
                      "group": "A"
                    }
                  }
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "info"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "green"
                        }
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "warn"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "yellow"
                        }
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "error"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "red"
                        }
                      }
                    ]
                  }
                ]
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "none"
                }
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (level) (count_over_time({k8s_namespace_name=\"o11y\"} | json | __error__=\"\" | label_format level=`{{ lower .level }}` [$__interval]))",
                  "legendFormat": "{{level}}"
                }
              ]
            },
            {
              "type": "piechart",
              "title": "Log Level Distribution",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  }
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "info"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "green"
                        }
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "warn"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "yellow"
                        }
                      }
                    ]
                  },
                  {
                    "matcher": {
                      "id": "byName",
                      "options": "error"
                    },
                    "properties": [
                      {
                        "id": "color",
                        "value": {
                          "mode": "fixed",
                          "fixedColor": "red"
                        }
                      }
                    ]
                  }
                ]
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true,
                  "values": []
                },
                "pieType": "pie",
                "reduceOptions": {
                  "calcs": [
                    "sum"
                  ],
                  "fields": "",
                  "values": false
                },
                "tooltip": {
                  "mode": "single",
                  "sort": "none"
                }
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (level) (count_over_time({k8s_namespace_name=\"o11y\"} | json | __error__=\"\" | label_format level=`{{ lower .level }}` [$__interval]))",
                  "legendFormat": "{{level}}"
                }
              ]
            },
            {
              "type": "logs",
              "title": "Recent Logs",
              "gridPos": {
                "h": 10,
                "w": 24,
                "x": 0,
                "y": 8
              },
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "options": {
                "showTime": true,
                "showLabels": true,
                "showCommonLabels": false,
                "wrapLogMessage": false,
                "prettifyLogMessage": false,
                "enableLogDetails": true,
                "dedupStrategy": "none",
                "sortOrder": "Descending"
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "{k8s_namespace_name=\"o11y\"} | json | __error__=\"\" | label_format level=\"\""
                }
              ]
            }
          ]
        }
