apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor
  namespace: skillsmkt
  labels:
    app: order-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
    spec:
      serviceAccountName: order-processor-sa
      terminationGracePeriodSeconds: 30
      nodeSelector:
        karpenter.sh/nodepool: skm-app-nodepool
      tolerations:
        - key: dedicated
          operator: Equal
          value: order-processor
          effect: NoSchedule
      containers:
        - name: order-processor
          image: IMAGE_URI
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
            - name: SQS_QUEUE_URL
              value: "QUEUE_URL_VALUE"
            - name: PROCESSING_TIME
              value: "3"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: order-processor
  namespace: skillsmkt
spec:
  type: ClusterIP
  selector:
    app: order-processor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
